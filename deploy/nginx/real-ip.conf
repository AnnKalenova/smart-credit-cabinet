# Адрес посетителя — из заголовка X-Forwarded-For, который ставит Caddy. Заголовку верим только из сети
# edge (deploy/docker-compose.prod.yml): иначе любой мог бы подставить чужой адрес и обойти ограничение
# попыток входа. Без этого все посетители выглядели бы для nginx и API как один адрес Caddy.
set_real_ip_from 172.30.250.0/24;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
