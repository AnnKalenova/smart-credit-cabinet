# Раздача SPA и обратный прокси к API (файл подключается внутрь блока http как conf.d/default.conf)

# Сквозной идентификатор запроса: берём от клиента, только если он похож на идентификатор, иначе генерируем
map $http_x_request_id $req_id {
    default                    $request_id;
    "~^[A-Za-z0-9._-]{1,64}$"  $http_x_request_id;
}

# Схема исходного запроса. На сервере перед nginx стоит Caddy с HTTPS (deploy/) и сообщает её в заголовке;
# без внешнего прокси — своя схема соединения
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

# Вход: не больше 20 попыток в минуту с одного адреса (пачкой — до 10 сразу).
# Подбор пароля к конкретному логину дополнительно ограничивает сам API
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 12m;

    # DNS Docker: адрес api перечитывается, если контейнер пересоздан
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # адрес клиента — из соединения, а не из присланного заголовка (его можно подделать). За Caddy
    # (deploy/) адрес соединения заменяет модуль real_ip — только для запросов из сети самого Caddy
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Request-ID $req_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /api/ {
        proxy_pass $api_upstream;
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @login_rate_limited;
        proxy_pass $api_upstream;
    }

    location @login_rate_limited {
        default_type application/json;
        return 429 '{"detail":"Слишком много попыток входа. Попробуйте через минуту"}';
    }

    location /health/ {
        proxy_pass $api_upstream;
    }

    # Метрики Prometheus наружу не публикуются: их собирают изнутри сети Docker
    # (на стенде — http://localhost:8000/metrics, порт API открыт только для localhost)
    location = /metrics {
        deny all;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Файлы сборки с хешем в имени можно кэшировать надолго
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Все остальные пути — маршруты SPA. Политика безопасности контента — только для страниц интерфейса:
    # Swagger (/api/docs) берёт скрипты с CDN и под неё не попадает
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }
}
