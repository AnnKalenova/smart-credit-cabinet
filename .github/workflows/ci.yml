name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — линтер и тесты
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: credit
          POSTGRES_PASSWORD: credit
          POSTGRES_DB: credit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credit -d credit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://credit:credit@localhost:5432/credit_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Зависимости (строго по lock-файлам с хешами)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: pip-audit — известные уязвимости в Python-зависимостях (API, воркер, симулятор)
        run: >-
          pip-audit --require-hashes --disable-pip --progress-spinner off
          -r requirements.txt -r requirements-dev.txt -r ../integrations-mock/requirements.txt
      - name: Ruff — линтер
        run: ruff check . ../integrations-mock ../e2e ../tools ../loadtest
      - name: Ruff — форматирование
        run: ruff format --check . ../integrations-mock ../e2e ../tools ../loadtest
      - name: Pytest — модульные и интеграционные тесты
        run: pytest
      - name: OpenAPI в docs/ совпадает с кодом
        run: |
          python ../tools/export_openapi.py
          git diff --exit-code -- ../docs/openapi.json ../docs/openapi-integrations-mock.json

  frontend:
    name: Frontend — сборка
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: npm audit — известные уязвимости в зависимостях интерфейса (high и выше)
        run: npm audit --audit-level=high
      - name: ESLint — TypeScript и правила хуков React
        run: npm run lint
      - name: Проверка типов и сборка
        run: npm run build

  images:
    name: Docker-образы — уязвимости (Trivy)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, integrations-mock]
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker compose build ${{ matrix.service }}
      - name: Имя собранного образа
        id: image
        run: echo "ref=$(docker compose config --format json | jq -r '.services["${{ matrix.service }}"].image')" >> "$GITHUB_OUTPUT"
      # Действие закреплено по хешу коммита (v0.36.0), а не по тегу: теги действий уже подменяли в атаке на цепочку
      # поставок. Критические уязвимости с доступным исправлением останавливают сборку; высокие — в отчёте
      - name: Критические уязвимости (с исправлением) — сборка останавливается
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Высокие уязвимости — отчёт
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: "0"
          skip-setup-trivy: true

  e2e-docker:
    name: Docker Compose — сквозные сценарии
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Сборка и запуск всех сервисов
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Сквозные сценарии через веб-шлюз (nginx → API)
        run: |
          pip install httpx==0.28.1
          python e2e/api_scenarios.py --base-url http://localhost:8080
      - name: Чистый стенд для Postman-коллекции
        # сквозные сценарии выдали кредиты демо-компаниям, а коллекция рассчитана на исходные данные
        run: |
          docker compose down -v
          docker compose up -d --wait --wait-timeout 300
      - name: Postman-коллекция (newman)
        run: npx --yes newman@6.2.3 run docs/postman/smart-credit-cabinet.postman_collection.json --env-var baseUrl=http://localhost:8080
      - name: Проверки интерфейса в браузере (Playwright)
        # автосохранение черновика: сбой и медленный ответ не должны отправить заявку со старыми условиями
        run: |
          pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
          python e2e/ui_checks.py --base-url http://localhost:8080
      - name: Проверка веб-интерфейса и Swagger
        run: |
          curl -fsS http://localhost:8080/ | grep -qi "<!doctype html"
          curl -fsS http://localhost:8080/api/openapi.json > /dev/null
          curl -fsS http://localhost:8080/health/ready
      - name: Метрики доступны только напрямую с API, не через веб-шлюз
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/metrics)" = "403"
          curl -fsS http://localhost:8000/metrics | grep -q pipeline_queue_depth
      - name: Воркер здоров (файл-пульс)
        run: test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q worker)")" = "healthy"
      - name: Логи контейнеров при ошибке
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Остановка стенда
        if: always()
        run: docker compose down -v
